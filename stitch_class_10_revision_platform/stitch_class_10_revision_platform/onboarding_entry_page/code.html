                        "background-dark": "#0f2323",

<style>
        body {
            font-family: 'Open Sans', sans-serif;

        .heading-font {
            font-family: 'Lexend', sans-serif;

<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<!-- Main Container -->
<main class="w-full max-w-md">
<!-- Logo/Brand Icon Section -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 mb-4">
<span class="material-icons-outlined text-white text-3xl">science</span>

<h1 class="heading-font text-3xl font-bold text-primary dark:text-primary tracking-tight">Focus Lab Revision</h1>
<p class="text-primary/70 dark:text-primary/50 text-sm mt-1 font-medium">Class 10 Science Excellence</p>
</div>
<!-- Central Onboarding Card -->
<div class="bg-white dark:bg-background-dark/50 border border-primary/10 dark:border-primary/20 rounded-xl shadow-xl p-8 backdrop-blur-sm">
<div class="mb-8">
<h2 class="heading-font text-xl font-semibold text-gray-800 dark:text-white">Welcome!</h2>
<p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Let's get your personalized revision session started.</p>
</div>
<form class="space-y-6">
<!-- Name Input -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300" for="full-name">
                        What is your name?
                    </label>
<div class="relative">
<span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-primary/40 text-xl">person</span>
<input class="w-full pl-11 pr-4 py-3 bg-primary/5 dark:bg-primary/10 border border-primary/20 focus:border-primary focus:ring-2 focus:ring-primary/20 rounded-lg text-gray-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 transition-all outline-none" id="full-name" placeholder="e.g., John Doe" type="text"/>
</div>
</div>
<!-- Class Selection Dropdown -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300" for="class-select">
                        Select your class
                    </label>
<div class="relative">
<span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-primary/40 text-xl">school</span>
<select class="w-full pl-11 pr-10 py-3 bg-primary/5 dark:bg-primary/10 border border-primary/20 focus:border-primary focus:ring-2 focus:ring-primary/20 rounded-lg text-gray-900 dark:text-white appearance-none transition-all outline-none" id="class-select">
<option selected="" value="10">Class 10</option>
<option value="9">Class 9 (Coming Soon)</option>
<option value="11">Class 11 (Coming Soon)</option>
</select>
<span class="material-icons-outlined absolute right-3 top-1/2 -translate-y-1/2 text-primary/40 pointer-events-none">expand_more</span>
</div>
</div>
<!-- CTA Button -->
<div class="pt-4">
<button class="w-full py-4 bg-accent-amber hover:bg-[#FFB300] active:scale-[0.98] text-gray-900 heading-font font-bold text-lg rounded-lg shadow-lg shadow-accent-amber/20 transition-all flex items-center justify-center gap-2 group" type="submit">
                        Start Revision
                        <span class="material-icons-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-8 pt-6 border-t border-primary/10 flex flex-col items-center gap-3">
<div class="flex items-center gap-2 text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest font-semibold">
<span class="w-8 h-px bg-primary/20"></span>
<span>Resources Included</span>
<span class="w-8 h-px bg-primary/20"></span>
</div>
<div class="flex gap-4">
<div class="flex items-center gap-1 text-gray-400 text-xs">
<span class="material-icons-outlined text-sm">auto_stories</span>
<span>Notes</span>
</div>
<div class="flex items-center gap-1 text-gray-400 text-xs">
<span class="material-icons-outlined text-sm">quiz</span>
<span>MCQs</span>
</div>
<div class="flex items-center gap-1 text-gray-400 text-xs">
<span class="material-icons-outlined text-sm">history_edu</span>

</div>
</div>
